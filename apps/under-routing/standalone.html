<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Underground Route Planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231f2733'/><path d='M2 11 L7 6 L10 6 L14 3' stroke='%23d98a2b' stroke-width='1.6' fill='none'/></svg>"
    />
    <meta
      name="description"
      content="Plan the shortest 45° underground cable routes between feeder panels and loads while minimising crossings."
    />
    <style>
/* ===========================================================================
   Engineering Tools Hub — shared design system.

   Single source of truth for the palette and typography used across every
   application. The tokens are the ones established by the LV Cable Voltage
   Drop tool: a light, technical, instrument-panel look — no gradients, no
   decorative colour.

   Fonts come from Google Fonts. If the network is unavailable the stack falls
   back to system sans / system monospace and the layout is unaffected.
   ======================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #eceff2;
  --panel: #ffffff;
  --ink: #1d2530;
  --muted: #5c6875;
  --steel: #c6cdd4;
  --accent: #0e5da8;
  --accent-dark: #0b4c8a;
  --accent-wash: #eef4fb;
  --ok: #1e7d46;
  --bad: #b3261e;
  --warn: #d99a00;
  --warn-wash: #fdf6e3;
  --plate: #2a323c;
  --plate-edge: #3d4854;
  --plate-ink: #e8edf2;
  --plate-mut: #9fb0c0;
  --field: #fbfcfd;

  --ui: 'Saira Semi Condensed', system-ui, -apple-system, Segoe UI, sans-serif;
  --data: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
}

/* ------------------------------- header -------------------------------- */

.eh-header {
  border-bottom: 3px solid var(--ink);
  padding-bottom: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 10px;
}
.eh-header h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.eh-sub {
  font-family: var(--data);
  font-size: 12px;
  color: var(--muted);
}
.eh-back {
  font-family: var(--data);
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--steel);
  background: var(--panel);
  border-radius: 4px;
  padding: 6px 12px;
  white-space: nowrap;
}
.eh-back:hover { background: var(--accent-wash); border-color: var(--accent); }

/* -------------------------------- cards -------------------------------- */

.eh-card {
  background: var(--panel);
  border: 1px solid var(--steel);
  border-radius: 6px;
  padding: 18px;
}
.eh-card > h2 {
  margin: 0 0 14px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--muted);
  font-weight: 600;
}

/* -------------------------------- fields ------------------------------- */

.eh-label,
.eh-card label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--muted);
  margin-bottom: 4px;
}
.eh-card input,
.eh-card select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--steel);
  border-radius: 4px;
  font-family: var(--data);
  font-size: 14px;
  color: var(--ink);
  background: var(--field);
}
.eh-card input:focus,
.eh-card select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.eh-card input:disabled,
.eh-card input[readonly],
.eh-card select:disabled { background: #eef1f4; color: #7d8894; }

/* ------------------------------- buttons ------------------------------- */

.eh-btn {
  border: 1px solid var(--steel);
  background: var(--field);
  color: var(--ink);
  padding: 9px 14px;
  border-radius: 4px;
  font-family: var(--ui);
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
}
.eh-btn:hover { background: var(--accent-wash); border-color: var(--accent); }
.eh-btn-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.eh-btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

.eh-seg { display: flex; border: 1px solid var(--steel); border-radius: 4px; overflow: hidden; }
.eh-seg button {
  flex: 1;
  padding: 8px 4px;
  border: 0;
  background: var(--field);
  cursor: pointer;
  font-family: var(--data);
  font-size: 13px;
  color: var(--muted);
}
.eh-seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

/* ------------------------------ nameplate ------------------------------ */

.eh-plate {
  background: linear-gradient(160deg, var(--plate-edge), var(--plate) 40%);
  border-radius: 8px;
  padding: 20px 22px;
  color: var(--plate-ink);
  position: relative;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 4px 14px rgba(0, 0, 0, 0.25);
  border: 1px solid #171c22;
}
.eh-screw {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #cfd6dd, #6b747d 70%);
}
.eh-screw::after {
  content: "";
  position: absolute;
  left: 1px;
  right: 1px;
  top: 4px;
  height: 1.5px;
  background: #3a4149;
}
.eh-plate .tagline {
  font-family: var(--data);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--plate-mut);
  text-transform: uppercase;
}
.eh-plate table { width: 100%; border-collapse: collapse; font-family: var(--data); font-size: 13px; }
.eh-plate td { padding: 5px 0; border-top: 1px solid rgba(255, 255, 255, 0.12); }
.eh-plate td:last-child { text-align: right; font-weight: 600; }

.eh-status {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.eh-status-ok { background: var(--ok); color: #fff; }
.eh-status-bad { background: var(--bad); color: #fff; }
.eh-status-warn { background: var(--warn); color: #3a2a00; }
.eh-status-idle { background: #55606c; color: #d6dde4; }

/* ------------------------------- notices ------------------------------- */

.eh-warn {
  padding: 8px 12px;
  border-left: 4px solid var(--warn);
  background: var(--warn-wash);
  font-size: 13px;
  border-radius: 0 4px 4px 0;
}
.eh-note {
  border: 1px dashed var(--accent);
  background: var(--accent-wash);
  border-radius: 6px;
  padding: 14px 16px;
}
.eh-foot {
  margin-top: 20px;
  font-size: 11.5px;
  color: var(--muted);
  font-family: var(--data);
  line-height: 1.6;
}

.eh-mono { font-family: var(--data); }

:root {
  --ink: #1d2530;
  --ink-soft: #5c6875;
  --line: #c6cdd4;
  --bg: #eceff2;
  --panel-bg: #ffffff;
  --accent: #0e5da8;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
}

/* ---- toolbar ---- */

.toolbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  flex-wrap: wrap;
}

.toolbar-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tbtn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 7px 12px;
  background: #fff;
  color: var(--ink);
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}

.tbtn:hover {
  background: #eef4fb;
}

.tbtn.active {
  background: var(--ink);
  color: #fff;
}

.tbtn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.statusline {
  flex: 1;
  text-align: right;
  font-size: 12px;
  letter-spacing: 0.6px;
  color: var(--ink-soft);
  text-transform: uppercase;
  min-width: 260px;
}

.statusline b {
  color: var(--ink);
}

/* ---- stage / canvas ---- */

.stage {
  position: relative;
  height: calc(100% - 52px);
  overflow: hidden;
}

#canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: default;
  touch-action: none;
}

#canvas.panning {
  cursor: grabbing;
}

#canvas.adding {
  cursor: crosshair;
}

#canvas.foundation-mode,
#canvas.tag-mode,
#canvas.drawing-foundation {
  cursor: crosshair;
}

/* SVG element styling */
.panel-box {
  fill: var(--panel-bg);
  stroke: var(--ink);
  stroke-width: 2;
}
.panel-box.selected {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.panel-sep {
  stroke: var(--line);
  stroke-width: 1;
}
.panel-numstrip {
  fill: #1d2530;
  stroke: none;
}
.panel-numsep {
  stroke: #5c6875;
  stroke-width: 1;
}
.panel-hatch {
  fill: url(#hatch);
  stroke: none;
}
.panel-num {
  fill: #fff;
  stroke: #1d2530;
  stroke-width: 2.5;
  stroke-opacity: 0.8;
  paint-order: stroke fill;
  font: 600 11px var(--mono);
  dominant-baseline: middle;
}
.panel-label {
  fill: #1d2530;
  stroke: #ffffff;
  stroke-width: 2.5;
  stroke-opacity: 0.7;
  paint-order: stroke fill;
  font: 600 11px var(--mono);
  letter-spacing: 0.5px;
  dominant-baseline: middle;
}
.panel-size {
  fill: #5c6875;
  stroke: #ffffff;
  stroke-width: 2;
  stroke-opacity: 0.7;
  paint-order: stroke fill;
  font: 500 7px var(--mono);
  letter-spacing: 0.25px;
  dominant-baseline: middle;
}
.panel-end-label {
  fill: #1d2530;
  stroke: #ffffff;
  stroke-width: 2;
  stroke-opacity: 0.7;
  paint-order: stroke fill;
  font: 600 6px var(--mono);
  letter-spacing: 0.25px;
  dominant-baseline: middle;
}
.panel-title {
  fill: #ffffff;
  stroke: #1d2530;
  stroke-width: 3;
  stroke-opacity: 0.65;
  paint-order: stroke fill;
  font: 700 13px var(--mono);
  letter-spacing: 1px;
}
.panel-tap {
  fill: #ffffff;
  stroke: #1d2530;
  stroke-width: 0.6;
}
.route {
  fill: none;
  stroke-width: 2.4;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}
.route.blocked {
  stroke: #b3261e !important;
  stroke-width: 3.2;
  stroke-dasharray: 8 5;
}
.foundation {
  cursor: move;
}
.foundation-area {
  fill: rgba(180, 57, 45, 0.16);
  stroke: #8f1e18;
  stroke-width: 2;
  stroke-dasharray: 7 4;
}
.foundation-area.selected {
  fill: rgba(47, 111, 216, 0.12);
  stroke: var(--accent);
  stroke-width: 2.5;
}
.foundation-label {
  fill: #b3261e;
  stroke: #ffffff;
  stroke-width: 2.5;
  stroke-opacity: 0.65;
  paint-order: stroke fill;
  font: 700 11px var(--mono);
  letter-spacing: 0.5px;
  pointer-events: none;
}
.foundation-size {
  fill: #b3261e;
  stroke: #ffffff;
  stroke-width: 2;
  stroke-opacity: 0.65;
  paint-order: stroke fill;
  font: 600 10px var(--mono);
  pointer-events: none;
}
.tag {
  cursor: move;
}
.tag-box {
  fill: rgba(47, 111, 216, 0.08);
  stroke: #5c6875;
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
}
.tag-box.selected {
  fill: rgba(47, 111, 216, 0.14);
  stroke: var(--accent);
  stroke-width: 2.5;
}
.tag-label {
  fill: #1d2530;
  stroke: #ffffff;
  stroke-width: 2.5;
  stroke-opacity: 0.65;
  paint-order: stroke fill;
  font: 700 11px var(--mono);
  letter-spacing: 0.5px;
  dominant-baseline: middle;
  pointer-events: none;
}
.load {
  cursor: pointer;
}
.load-ring {
  fill: #fff;
  stroke-width: 2.4;
}
.load-select {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.5;
  stroke-dasharray: 3 2;
}
.load-tag {
  fill: #1d2530;
  font: 700 12px var(--mono);
  letter-spacing: 0.5px;
}
.load-sub {
  fill: #1d2530;
  font: 500 10px var(--mono);
}
.rotate-handle {
  cursor: grab;
}
.rotate-handle circle {
  fill: #fff;
  stroke: var(--accent);
  stroke-width: 1.5;
}
.rotate-handle text {
  fill: var(--accent);
  font: 700 12px var(--mono);
}

/* ---- zoom controls ---- */

.zoom-controls {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

.zoom-controls button {
  width: 34px;
  height: 34px;
  font-size: 16px;
  background: #fff;
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
}

.zoom-controls button:hover {
  background: #eef4fb;
}

.zoom-level {
  font-size: 11px;
  color: var(--ink-soft);
}

.hint {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--ink-soft);
  background: rgba(255, 255, 255, 0.85);
  padding: 4px 10px;
  border-radius: 3px;
  pointer-events: none;
}

/* ---- modals ---- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 26, 34, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.modal-backdrop[hidden] {
  display: none;
}

.modal {
  background: #fff;
  border: 1.5px solid var(--ink);
  border-radius: 5px;
  width: min(680px, 92vw);
  max-height: 88vh;
  overflow: auto;
  padding: 18px 20px 20px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
}

.modal.small {
  width: min(420px, 92vw);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.modal h2 {
  font-size: 16px;
  margin: 0;
  letter-spacing: 0.5px;
}

.modal-note {
  font-size: 12px;
  color: var(--ink-soft);
  margin: 4px 0 14px;
  line-height: 1.5;
}

.icon-btn {
  border: none;
  background: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--ink-soft);
  line-height: 1;
}

.panel-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 12px;
}

.panel-row {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px;
  background: #fbfcfd;
}

.panel-row .row-top {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  margin-bottom: 12px;
}

.field span {
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-size: 11px;
}

.field input,
.field select,
.panel-row input,
.panel-row textarea {
  font-family: var(--mono);
  font-size: 13px;
  padding: 7px 9px;
  border: 1.5px solid var(--line);
  border-radius: 3px;
  background: #fff;
}

.panel-row .grow {
  flex: 1;
  min-width: 140px;
}

.panel-row label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11px;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.panel-row textarea {
  width: 100%;
  margin-top: 10px;
  resize: vertical;
  min-height: 60px;
  text-transform: none;
  color: var(--ink);
}

.panel-row .row-actions {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.link-btn {
  border: none;
  background: none;
  color: #b3261e;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  padding: 0;
}

.ghost-btn {
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px 12px;
  border: 1.5px dashed var(--line);
  background: #fff;
  border-radius: 3px;
  cursor: pointer;
  width: 100%;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.ghost-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

.toggle-cols {
  border: none;
  background: none;
  color: var(--accent);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  padding: 0;
}

/* Hub back-link rendered as a toolbar button. */
.tbtn.hub {
  display: inline-block;
  text-decoration: none;
  line-height: normal;
  color: var(--accent);
  border-color: var(--accent);
}
.tbtn.hub:hover { background: #eef4fb; }

</style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-buttons">
        <button id="btn-setup" class="tbtn">&larr; SETUP</button>
        <button id="btn-route" class="tbtn active">ROUTE LOADS</button>
        <button id="btn-foundation" class="tbtn">DRAW FOUNDATION</button>
        <button id="btn-tag" class="tbtn">DRAW TAG</button>
        <button id="btn-wall" class="tbtn">&#8635; WALL: RIGHT</button>
        <button id="btn-clear-routes" class="tbtn">CLEAR ROUTES</button>
        <button id="btn-clear-loads" class="tbtn">CLEAR LOADS</button>
        <button id="btn-clear-foundations" class="tbtn">CLEAR FOUNDATIONS</button>
        <button id="btn-export" class="tbtn">EXPORT PDF</button>
      </div>
      <div class="statusline" id="statusline"></div>
    </header>

    <main class="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern
            id="hatch"
            width="6"
            height="6"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <line x1="0" y1="0" x2="0" y2="6" stroke="#c9d2dd" stroke-width="1.2" />
          </pattern>
        </defs>
      </svg>

      <div class="zoom-controls">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">&minus;</button>
        <button id="zoom-fit" title="Fit to content">&#8599;</button>
        <div class="zoom-level" id="zoom-level">132%</div>
      </div>

      <div class="hint" id="hint"></div>
    </main>

    <!-- Setup modal: configure panels -->
    <div class="modal-backdrop" id="modal-setup" hidden>
      <div class="modal">
        <div class="modal-head">
          <h2>Panel setup</h2>
          <button class="icon-btn" id="setup-close">&times;</button>
        </div>
        <p class="modal-note">
          Each column is always 3&nbsp;ft (36&nbsp;in) wide. Define one or more
          panels, their number of columns and — optionally — a label per column.
          An END SECTION is added automatically at each end.
        </p>
        <div id="panel-list" class="panel-list"></div>
        <button class="ghost-btn" id="add-panel">+ Add panel</button>
        <div class="modal-actions">
          <button class="tbtn" id="setup-cancel">Cancel</button>
          <button class="tbtn primary" id="setup-save">Save panels</button>
        </div>
      </div>
    </div>

    <!-- Load modal: add / edit a load -->
    <div class="modal-backdrop" id="modal-load" hidden>
      <div class="modal small">
        <div class="modal-head">
          <h2 id="load-title">Add load</h2>
          <button class="icon-btn" id="load-close">&times;</button>
        </div>
        <label class="field">
          <span>Tag</span>
          <input type="text" id="load-tag" placeholder="e.g. MCC A" autocomplete="off" />
        </label>
        <label class="field">
          <span>Panel</span>
          <select id="load-panel"></select>
        </label>
        <label class="field">
          <span>Column</span>
          <select id="load-col"></select>
        </label>
        <div class="modal-actions">
          <button class="tbtn" id="load-cancel">Cancel</button>
          <button class="tbtn primary" id="load-save">Add load</button>
        </div>
      </div>
    </div>

    <!-- Tag modal: label a tag rectangle -->
    <div class="modal-backdrop" id="modal-tag" hidden>
      <div class="modal small">
        <div class="modal-head">
          <h2>Tag rectangle</h2>
          <button class="icon-btn" id="tag-close">&times;</button>
        </div>
